# Static deployment for GitHub Pages.
#
# Node 22 is the version this template is developed and verified against.
# Pages runs `npm ci` + `npm run build` from the repository root and publishes
# the `dist/` artifact.
#
# Deployment target is resolved in this order:
#   1. `public/CNAME` — custom domain (e.g. barnamesazi-pishrafte.danialrashidi.ir).
#      Served from the root, so BASE_PATH is "/" and SITE_URL is the domain.
#      Astro copies `public/CNAME` to `dist/CNAME`, which keeps the Pages
#      custom-domain assignment alive on every deploy.
#   2. `DEPLOY_BASE` / `SITE_URL` repository variables (manual override).
#   3. Repository-name fallback for project sites (`/<repo>/`).
#
# For a user/organisation site (https://<owner>.github.io) with no CNAME file,
# set the `DEPLOY_BASE` repository variable to "/" in the repository settings.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a publish halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deployment target
        id: pages-meta
        env:
          DEPLOY_BASE: ${{ vars.DEPLOY_BASE }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -f public/CNAME ]; then
            DOMAIN="$(head -n 1 public/CNAME | tr -d '[:space:]')"
            if [ -z "$DOMAIN" ]; then
              echo "public/CNAME is empty" >&2
              exit 1
            fi
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "site=https://$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "Custom domain $DOMAIN -> BASE_PATH=/ SITE_URL=https://$DOMAIN"
          else
            if [ -n "$DEPLOY_BASE" ]; then
              BASE="$DEPLOY_BASE"
            else
              BASE="/$REPO_NAME"
            fi
            if [ -n "$SITE_URL_VAR" ]; then
              SITE="$SITE_URL_VAR"
            else
              SITE="https://$REPO_OWNER.github.io/$REPO_NAME"
            fi
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "site=$SITE" >> "$GITHUB_OUTPUT"
            echo "Project site -> BASE_PATH=$BASE SITE_URL=$SITE"
          fi

      - name: Build static site
        env:
          # A repo named "physics2" without a CNAME file is served from
          # /physics2/, so every asset and link Astro emits has to carry
          # that prefix. A custom domain is always served from the root.
          BASE_PATH: ${{ steps.pages-meta.outputs.base }}
          SITE_URL: ${{ steps.pages-meta.outputs.site }}
        run: npm run build

      - name: Validate built output
        env:
          BASE_PATH: ${{ steps.pages-meta.outputs.base }}
        run: node scripts/validate-content.mjs --links

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
